# Serves the Angular app and forwards /api to the NestJS container (same origin, no CORS).
# Runs as non-root (nginx-unprivileged), so it listens on 8080.

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

  include /etc/nginx/security-headers.conf;

  # ^~ keeps /api/ assets (Swagger .js and .css) away from the static file rules below.
  location ^~ /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # The API trusts one proxy hop, so per-IP rate limits see the real client.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx sets the id of every request, replacing one from the client. The API keeps it when it is a safe token (X-Request-Id).
    proxy_set_header X-Request-Id $request_id;
  }

  # Build output with a content hash in its name never changes, so cache it for a year.
  # The hash is 8 characters after "-", with at least one digit or capital (all-lowercase words
  # such as "-contact" are not hashes). Case-sensitive on purpose: the build writes lower case extensions.
  # A hashed file that is missing is a real 404, not index.html. No "always" on Cache-Control,
  # so a 404 is not cached for a year.
  location ~ "-(?=[A-Za-z0-9_]*[0-9A-Z])[A-Za-z0-9_]{8}\.(js|mjs|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # The favicon has no hash in its name, so it is not immutable.
  location = /favicon.ico {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/security-headers.conf;
  }

  # Other files with an asset extension have no hash (anything from apps/web/public), so they are not
  # immutable: the browser revalidates them. A missing one is a 404, not index.html.
  location ~* "\.(js|mjs|css|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico|txt)$" {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # Client-side routes (/products/P-10001) all load index.html, which must always be fresh.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }
}
