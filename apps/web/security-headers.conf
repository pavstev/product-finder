# Sent on every response. nginx drops server-level add_header lines in a location that has
# its own add_header, so nginx.conf includes this file in the server and in those locations.

# PrimeNG injects styles at runtime, so style-src needs 'unsafe-inline'. A nonce setup is a next step.
# script-src is 'self' only. angular.json turns off inlineCritical so index.html has no inline script.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Only effective behind HTTPS. Browsers ignore it on plain HTTP.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
